<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>KinkPoints</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root{--radius-md:10px;--radius-lg:14px;--radius-xl:18px}

  /* ── Themes ── */
  body.theme-gg{
    --bg-page:#1a1118;--bg-surface:#221620;--bg-card:#2a1c27;--bg-input:#1f1520;--bg-done:#2d1a28;
    --border:#4a2e42;--border-light:#3a2235;
    --accent-light:#f4c0d1;--accent-mid:#d4537e;--accent-deep:#993556;
    --accent-bg:#3d1f32;--accent-bg-lite:#4d2840;--accent-border:#5c2040;
    --text-primary:#f0dce8;--text-secondary:#b8829e;--text-muted:#7a5068;--text-done:#7a5068;
  }
  body.theme-dad{
    --bg-page:#111620;--bg-surface:#161d2b;--bg-card:#1c2535;--bg-input:#141b28;--bg-done:#182030;
    --border:#2a3d5a;--border-light:#1f3048;
    --accent-light:#a8c8f0;--accent-mid:#4a90d9;--accent-deep:#2d6aad;
    --accent-bg:#172340;--accent-bg-lite:#1e2e50;--accent-border:#1a3a6e;
    --text-primary:#daeaf8;--text-secondary:#7aa8cc;--text-muted:#4a6a88;--text-done:#4a6a88;
  }
  body.theme-default{
    --bg-page:#1a1118;--bg-surface:#221620;--bg-card:#2a1c27;--bg-input:#1f1520;--bg-done:#2d1a28;
    --border:#4a2e42;--border-light:#3a2235;
    --accent-light:#f4c0d1;--accent-mid:#d4537e;--accent-deep:#993556;
    --accent-bg:#3d1f32;--accent-bg-lite:#4d2840;--accent-border:#5c2040;
    --text-primary:#f0dce8;--text-secondary:#b8829e;--text-muted:#7a5068;--text-done:#7a5068;
  }

  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg-page);color:var(--text-primary);min-height:100vh;padding:2rem 1rem 4rem;transition:background .3s,color .3s}

  /* ── Login screen ── */
  #loginScreen{position:fixed;inset:0;background:var(--bg-page);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
  #loginScreen.hidden{display:none}
  .login-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:2.5rem 2rem;width:100%;max-width:380px;display:flex;flex-direction:column;align-items:center;gap:1.25rem}
  .login-logo{width:60px;height:60px;border-radius:50%;background:var(--accent-bg);border:2px solid var(--accent-mid);display:flex;align-items:center;justify-content:center}
  .login-logo svg{color:var(--accent-mid);width:28px;height:28px}
  .login-title{font-size:22px;font-weight:700;color:var(--text-primary);text-align:center;letter-spacing:-.3px}
  .login-sub{font-size:13px;color:var(--text-muted);text-align:center;margin-top:8px}
  .login-field{width:100%;display:flex;flex-direction:column;gap:6px}
  .login-field label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted)}
  .login-field input{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-family:inherit;font-size:15px;padding:11px 14px;outline:none;transition:border-color .15s}
  .login-field input:focus{border-color:var(--accent-mid)}
  .login-field input::placeholder{color:var(--text-muted)}
  .login-btn{width:100%;height:46px;background:var(--accent-mid);color:#fff;border:none;border-radius:var(--radius-md);font-size:15px;font-weight:600;cursor:pointer;transition:background .15s,transform .1s}
  .login-btn:hover{background:var(--accent-deep)}
  .login-btn:active{transform:scale(.98)}
  .login-error{font-size:12px;color:#e06060;text-align:center;min-height:16px}

  /* ── App ── */
  #appScreen{display:none}
  #appScreen.visible{display:block}
  .app{max-width:640px;margin:0 auto}

  /* ── Top bar ── */
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem}
  .app-brand{font-size:13px;font-weight:700;color:var(--accent-mid);letter-spacing:.5px;text-transform:uppercase}
  .logout-btn{background:none;border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-muted);font-size:12px;font-weight:600;padding:5px 12px;cursor:pointer;transition:all .15s}
  .logout-btn:hover{border-color:var(--accent-mid);color:var(--accent-light)}

  /* ── Profile switcher ── */
  .profile-switcher{display:flex;gap:6px;margin-bottom:1.25rem;background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:5px}
  .profile-btn{flex:1;min-height:44px;border-radius:var(--radius-lg);border:none;background:transparent;font-size:13px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;color:var(--text-muted);transition:all .2s;padding:6px 4px;position:relative}
  .profile-btn .p-name-row{display:flex;align-items:center;gap:5px}
  .profile-btn .p-name{font-size:13px;font-weight:600}
  .profile-btn .p-role{font-size:10px;font-weight:500;opacity:.7;text-transform:uppercase;letter-spacing:.3px}
  .profile-btn:hover{color:var(--text-secondary)}
  .profile-btn.active-gg{background:var(--accent-bg);color:#f4c0d1}
  .profile-btn.active-dad{background:var(--accent-bg);color:#a8c8f0}
  .profile-btn.active-gg .p-role,.profile-btn.active-dad .p-role{opacity:.8}
  .you-badge{font-size:9px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;background:var(--accent-bg-lite);color:var(--accent-mid);padding:1px 5px;border-radius:4px}

  /* ── Screen tabs ── */
  .screen-tabs{display:flex;gap:6px;margin-bottom:1.5rem}
  .screen-tab{flex:1;height:36px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-card);color:var(--text-muted);font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
  .screen-tab svg{width:15px;height:15px}
  .screen-tab:hover{border-color:var(--accent-mid);color:var(--accent-light)}
  .screen-tab.active{background:var(--accent-bg);border-color:var(--accent-mid);color:var(--accent-light)}

  /* ── Sync ── */
  .header-row{display:flex;align-items:center;justify-content:flex-end;margin-bottom:1.25rem;margin-top:-.25rem}
  .sync-indicator{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;letter-spacing:.3px;white-space:nowrap}
  .sync-indicator.syncing{background:#2a2820;color:#c8a84a}
  .sync-indicator.saved{background:#1e2d1e;color:#6abf6a}
  .sync-indicator.error{background:#2d1a1a;color:#e06060}
  .sync-indicator.loading{background:var(--bg-card);color:var(--text-muted)}

  /* ── Banners ── */
  .alltime-banner{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1rem 1.5rem;margin-bottom:1rem;display:flex;align-items:center}
  .alltime-left{display:flex;align-items:center;gap:12px}
  .alltime-icon{width:40px;height:40px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .alltime-icon svg{color:var(--accent-mid)}
  .alltime-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
  .alltime-val{font-size:28px;font-weight:700;color:var(--text-primary);line-height:1;letter-spacing:-.5px}
  .alltime-unit{font-size:13px;font-weight:500;color:var(--text-muted);margin-left:3px}

  .total-card{background:var(--accent-bg);border:1px solid var(--accent-border);border-radius:var(--radius-lg);padding:.9rem 1.25rem;margin-bottom:1.5rem;display:flex;align-items:center;justify-content:space-between}
  .total-label{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--accent-light);margin-bottom:3px;opacity:.8}
  .total-val{font-size:28px;font-weight:700;color:#fff;line-height:1;letter-spacing:-.5px}
  .total-unit{font-size:13px;font-weight:500;color:var(--accent-light);margin-left:4px;opacity:.7}
  .total-icon{width:40px;height:40px;border-radius:50%;background:var(--accent-bg-lite);display:flex;align-items:center;justify-content:center}
  .total-icon svg{color:var(--accent-mid)}

  /* ── Screens ── */
  .screen{display:none}
  .screen.visible{display:block}

  /* ── Week nav ── */
  .week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .week-nav-label{font-size:13px;font-weight:600;color:var(--text-secondary)}
  .week-nav-btns{display:flex;align-items:center;gap:4px}
  .nav-btn{width:32px;height:32px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .nav-btn:hover{border-color:var(--accent-mid);color:var(--accent-light);background:var(--accent-bg)}
  .nav-btn svg{width:16px;height:16px}
  .nav-today-btn{height:32px;padding:0 12px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-card);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .nav-today-btn:hover{border-color:var(--accent-mid);color:var(--accent-light);background:var(--accent-bg)}

  /* ── Week strip ── */
  .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:1.5rem}
  .day-pill{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;border-radius:var(--radius-lg);border:1px solid var(--border-light);background:var(--bg-card);cursor:pointer;transition:border-color .15s,background .15s;user-select:none}
  .day-pill:hover{border-color:var(--accent-deep)}
  .day-pill.active{background:var(--accent-bg);border-color:var(--accent-mid)}
  .day-label{font-size:10px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted)}
  .day-pill.active .day-label{color:var(--accent-light)}
  .day-num{font-size:16px;font-weight:500;color:var(--text-primary)}
  .day-pill.active .day-num{color:#fff}
  .day-pts{font-size:10px;font-weight:600;color:var(--accent-mid);min-height:13px}

  /* ── Section heads ── */
  .section-head{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .section-badge{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;padding:2px 7px;border-radius:20px}
  .section-badge.monthly{background:#2a1f3d;color:#a98fe0}
  .section-badge.daily{background:var(--accent-bg);color:var(--accent-light)}
  .section-badge.repeat{background:#1d2a2a;color:#6abfbf}
  .section-badge.assigned{background:#2d200a;color:#e8a84a}

  /* ── Task rows ── */
  .tasks-list{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem}
  .task-row{display:flex;align-items:flex-start;gap:12px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 12px 12px 14px;transition:border-color .15s,background .15s}
  .task-row:hover{border-color:var(--border)}
  .task-row.done{background:var(--bg-done)}
  .task-row.monthly-row{border-left:2px solid #7c5cbf}
  .task-row.repeat-row{border-left:2px solid #3a9e9e}
  .task-row.assigned-row{border-left:2px solid #c47c1a}
  .task-row.assigned-row.expiring-soon{border-left-color:#e05050}
  .task-check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--accent-deep);background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;margin-top:1px;transition:all .15s}
  .task-check:hover{background:var(--accent-bg)}
  .task-row.done .task-check{background:var(--accent-mid);border-color:var(--accent-mid)}
  .task-check svg{color:transparent;width:13px;height:13px}
  .task-row.done .task-check svg{color:#fff}
  .task-check.disabled{cursor:not-allowed;opacity:.4}
  .task-body{flex:1;min-width:0}
  .task-name{font-size:14px;font-weight:500;color:var(--text-primary);line-height:1.3}
  .task-row.done .task-name{color:var(--text-done);text-decoration:line-through}
  .task-desc{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.4}
  .task-row.done .task-desc{opacity:.6}
  .task-right{display:flex;align-items:center;gap:6px;flex-shrink:0;margin-top:1px}
  .pts-badge{font-size:12px;font-weight:600;color:var(--accent-light);background:var(--accent-bg-lite);padding:3px 9px;border-radius:20px}
  .task-row.done .pts-badge{opacity:.4}
  .expiry-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;white-space:nowrap}
  .expiry-tag.ok{background:#2d200a;color:#e8a84a}
  .expiry-tag.soon{background:#2d1010;color:#e06060}
  .expiry-tag.expired{background:#2d1010;color:#888;text-decoration:line-through}
  .task-delete{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:3px;border-radius:4px;display:flex;align-items:center;transition:color .15s}
  .task-delete:hover{color:#f09595}
  .task-delete svg{width:15px;height:15px}
  .task-delete-future{background:none;border:1px solid var(--border);cursor:pointer;color:var(--text-muted);padding:3px 7px;border-radius:var(--radius-md);font-size:10px;font-weight:600;transition:color .15s,border-color .15s;white-space:nowrap}
  .task-delete-future:hover{color:#f09595;border-color:#f09595}
  .empty-state{text-align:center;padding:1.5rem 1rem;color:var(--text-muted);font-size:13px;border:1px dashed var(--border-light);border-radius:var(--radius-lg)}
  .empty-state svg{display:block;margin:0 auto 8px;opacity:.4}

  /* ── Read-only notice ── */
  .readonly-notice{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 14px;font-size:12px;color:var(--text-muted);margin-bottom:1rem;text-align:center}

  /* ── Add form ── */
  .add-form{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1.25rem;display:flex;flex-direction:column;gap:10px}
  .add-form label{font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;color:var(--text-muted);display:block;margin-bottom:5px}
  .add-form input[type="text"],.add-form input[type="number"],.add-form input[type="date"],.add-form textarea,.add-form select{width:100%;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-md);color:var(--text-primary);font-family:inherit;font-size:14px;padding:9px 12px;outline:none;transition:border-color .15s;resize:none;color-scheme:dark}
  .add-form input:focus,.add-form textarea:focus,.add-form select:focus{border-color:var(--accent-mid)}
  .add-form input::placeholder,.add-form textarea::placeholder{color:var(--text-muted)}
  .form-row{display:grid;grid-template-columns:1fr 100px;gap:10px}
  .type-toggle{display:flex;gap:6px}
  .type-btn{flex:1;height:36px;border-radius:var(--radius-md);border:1px solid var(--border);background:var(--bg-input);color:var(--text-muted);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
  .type-btn:hover{border-color:var(--accent-mid);color:var(--accent-light)}
  .type-btn.active-daily{background:var(--accent-bg);border-color:var(--accent-mid);color:var(--accent-light)}
  .type-btn.active-monthly{background:#2a1f3d;border-color:#7c5cbf;color:#c4aaee}
  .type-btn.active-repeat{background:#1d2a2a;border-color:#3a9e9e;color:#7dd4d4}
  .type-btn.active-assigned{background:#2d200a;border-color:#c47c1a;color:#e8a84a}
  .assigned-fields{display:none;flex-direction:column;gap:10px}
  .assigned-fields.visible{display:flex}
  .add-btn{width:100%;height:40px;background:var(--accent-mid);color:#fff;border:none;border-radius:var(--radius-md);font-size:14px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:background .15s,transform .1s}
  .add-btn:hover{background:var(--accent-deep)}
  .add-btn:active{transform:scale(.98)}
  .add-btn svg{width:16px;height:16px}
  .divider{border:none;border-top:1px solid var(--border-light);margin:1.5rem 0}

  /* ── Permission toggles ── */
  .permissions-section{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1.25rem;margin-top:1.5rem}
  .permissions-title{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text-muted);margin-bottom:1rem}
  .perm-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light)}
  .perm-row:last-child{border-bottom:none;padding-bottom:0}
  .perm-row:first-of-type{padding-top:0}
  .perm-label{font-size:13px;font-weight:500;color:var(--text-primary)}
  .perm-desc{font-size:11px;color:var(--text-muted);margin-top:2px}
  .toggle{position:relative;width:44px;height:24px;flex-shrink:0}
  .toggle input{opacity:0;width:0;height:0;position:absolute}
  .toggle-slider{position:absolute;inset:0;background:var(--border);border-radius:24px;cursor:pointer;transition:background .2s}
  .toggle-slider:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
  .toggle input:checked + .toggle-slider{background:var(--accent-mid)}
  .toggle input:checked + .toggle-slider:before{transform:translateX(20px)}

  /* ── Shop ── */
  .balance-card{background:var(--bg-surface);border:1px solid var(--border);border-radius:var(--radius-xl);padding:1rem 1.5rem;margin-bottom:1.5rem;display:flex;align-items:center;gap:12px}
  .balance-left{display:flex;align-items:center;gap:12px}
  .balance-icon{width:40px;height:40px;border-radius:50%;background:var(--accent-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .balance-icon svg{color:var(--accent-mid)}
  .balance-label{font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--text-muted);margin-bottom:2px}
  .balance-val{font-size:24px;font-weight:700;color:var(--text-primary);line-height:1;letter-spacing:-.5px}
  .balance-unit{font-size:12px;color:var(--text-muted);margin-left:3px}
  .balance-spent{font-size:12px;color:var(--text-muted);margin-top:2px}
  .shop-grid{display:flex;flex-direction:column;gap:8px;margin-bottom:1.5rem}
  .shop-item{display:flex;align-items:flex-start;gap:12px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 12px 12px 14px;border-left:2px solid var(--accent-mid)}
  .shop-item-body{flex:1;min-width:0}
  .shop-item-name{font-size:14px;font-weight:500;color:var(--text-primary)}
  .shop-item-desc{font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.4}
  .shop-item-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .shop-cost{font-size:12px;font-weight:600;color:var(--accent-light);background:var(--accent-bg-lite);padding:3px 9px;border-radius:20px;white-space:nowrap}
  .redeem-btn{height:30px;padding:0 12px;background:var(--accent-mid);color:#fff;border:none;border-radius:var(--radius-md);font-size:12px;font-weight:600;cursor:pointer;transition:background .15s,opacity .15s;white-space:nowrap}
  .redeem-btn:hover{background:var(--accent-deep)}
  .redeem-btn:disabled{opacity:.35;cursor:not-allowed}
  .shop-delete{background:none;border:none;cursor:pointer;color:var(--text-muted);padding:3px;border-radius:4px;display:flex;align-items:center;transition:color .15s}
  .shop-delete:hover{color:#f09595}
  .shop-delete svg{width:15px;height:15px}
  .inv-item{display:flex;align-items:flex-start;gap:12px;background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:12px 12px 12px 14px;transition:background .15s}
  .inv-item.fulfilled{background:var(--bg-done)}
  .inv-item-body{flex:1;min-width:0}
  .inv-item-name{font-size:14px;font-weight:500;color:var(--text-primary)}
  .inv-item.fulfilled .inv-item-name{color:var(--text-done);text-decoration:line-through}
  .inv-item-meta{font-size:11px;color:var(--text-muted);margin-top:3px}
  .inv-item-right{display:flex;align-items:center;gap:6px;flex-shrink:0}
  .fulfil-btn{height:28px;padding:0 10px;background:transparent;color:var(--accent-mid);border:1px solid var(--accent-deep);border-radius:var(--radius-md);font-size:11px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap}
  .fulfil-btn:hover{background:var(--accent-bg)}

        Save profile

<script>
// ── Auth & session ─────────────────────────────────────────────
let currentUser = null; // { userId, firstName, lastName, nickname, role, email, partnerId, partnerNickname, partnerRole }

async function doLogin() {
  const email    = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;
  if (!email || !password) return;
  const btn = document.querySelector('.login-btn');
  btn.textContent = 'Signing in…'; btn.disabled = true;
  try {
    const res = await fetch('/api/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (res.ok) {
      await bootApp();
    } else {
      showLoginError(data.error || 'Invalid email or password');
    }
  } catch(e) {
    showLoginError('Could not reach server');
  }
  btn.textContent = 'Sign In'; btn.disabled = false;
}

function showLoginError(msg) {
  const el = document.getElementById('loginError');
  el.textContent = msg;
  setTimeout(() => { el.textContent = ''; }, 4000);
}

async function doLogout() {
  await fetch('/api/logout', { method:'POST' });
  currentUser = null;
  state = {};
  document.getElementById('appScreen').classList.remove('visible');
  document.getElementById('loginScreen').classList.remove('hidden');
  document.getElementById('loginEmail').value = '';
  document.getElementById('loginPassword').value = '';
}

async function bootApp() {
  // Get current user info
  const res = await fetch('/api/me');
  if (!res.ok) { return; } // not logged in
  currentUser = await res.json();

  // Apply theme
  applyTheme(currentUser.userId);

  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('appScreen').classList.add('visible');

  // Set viewing profile to own profile by default
  viewingProfile = currentUser.userId;
  await loadFromServer();
  updateProfileTabLabel();
}

// Check if already logged in on page load
async function checkSession() {
  try {
    const res = await fetch('/api/me');
    if (res.ok) {
      await bootApp();
    }
  } catch(e) {}
}

function applyTheme(userId) {
  document.body.className = userId === 'gg' ? 'theme-gg' : userId === 'dad' ? 'theme-dad' : 'theme-default';
}

// ── State ──────────────────────────────────────────────────────
let state = {};
let viewingProfile = null; // which profile tab we're viewing
let selectedDate = keyFromDate(new Date());
let saveTimer = null;
let addType = 'daily';
let currentScreen = 'tracker';

// ── Date helpers ───────────────────────────────────────────────
function keyFromDate(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function dateFromKey(k) { const [y,m,d]=k.split('-').map(Number); return new Date(y,m-1,d); }
function monthKey(k) { return k.slice(0,7); }
function getTodayKey() { return keyFromDate(new Date()); }
function uid() { return Math.random().toString(36).slice(2,10); }

// ── Profile state accessor ─────────────────────────────────────
function ps(profileId) {
  const id = profileId || viewingProfile;
  if (!state[id]) state[id] = {};
  const p = state[id];
  if (!p.days)             p.days = {};
  if (!p.monthly)          p.monthly = {};
  if (!p.monthlyDone)      p.monthlyDone = {};
  if (!p.repeating)        p.repeating = [];
  if (!p.repeatingDone)    p.repeatingDone = {};
  if (!p.repeatingDeleted) p.repeatingDeleted = {};
  if (!p.assigned)         p.assigned = [];
  if (!p.shop)             p.shop = [];
  if (!p.inventory)        p.inventory = [];
  return p;
}

function isOwnProfile() { return viewingProfile === currentUser.userId; }
function isPartnerProfile() { return viewingProfile === currentUser.partnerId; }

// ── Points ─────────────────────────────────────────────────────
function getDayPoints(key, profileId) {
  const p = ps(profileId);
  let pts = 0;
  const day = p.days[key];
  if (day) pts += day.tasks.reduce((s,t)=>s+(t.done?t.pts:0),0);
  const mk = monthKey(key), mdone = p.monthlyDone[mk]||{};
  (p.monthly[mk]||[]).forEach(t=>{ if(mdone[t.id]===key) pts+=t.pts; });
  const rdone = p.repeatingDone[key]||{};
  getRepeatingForDay(key, profileId).forEach(t=>{ if(rdone[t.id]) pts+=t.pts; });
  (p.assigned||[]).forEach(t=>{ if(t.completedOn===key) pts+=t.pts; });
  return pts;
}

function getTotalEarned(profileId) {
  const p = ps(profileId);
  let total = 0;
  Object.values(p.days).forEach(day=>{ total+=(day.tasks||[]).reduce((s,t)=>s+(t.done?t.pts:0),0); });
  Object.entries(p.monthlyDone).forEach(([mk,done])=>{ (p.monthly[mk]||[]).forEach(t=>{ if(done[t.id]) total+=t.pts; }); });
  Object.entries(p.repeatingDone).forEach(([dk,done])=>{ getRepeatingForDay(dk,profileId).forEach(t=>{ if(done[t.id]) total+=t.pts; }); });
  (p.assigned||[]).forEach(t=>{ if(t.completedOn) total+=t.pts; });
  return total;
}

function getTotalSpent(profileId) {
  return ps(profileId).inventory.reduce((s,i)=>s+i.cost,0);
}

function getBalance(profileId) { return getTotalEarned(profileId) - getTotalSpent(profileId); }

function getDayTasks(key, profileId) {
  const p = ps(profileId);
  if (!p.days[key]) p.days[key] = { tasks:[] };
  return p.days[key].tasks;
}
function getMonthlyTasks(key, profileId) { return ps(profileId).monthly[monthKey(key)]||[]; }
function getRepeatingForDay(key, profileId) {
  return ps(profileId).repeating.filter(t=>{
    if (t.startDate>key) return false;
    const del = ps(profileId).repeatingDeleted[t.id];
    return !(del&&key>=del);
  });
}

// ── API ────────────────────────────────────────────────────────
async function loadFromServer() {
  setSync('loading','Loading…');
  try {
    const res = await fetch('/api/data');
    if (res.status===401) { doLogout(); return; }
    if (!res.ok) throw new Error();
    state = await res.json();
    ps(currentUser.userId);
    if (currentUser.partnerId) ps(currentUser.partnerId);
    setSync('saved','Up to date');
    renderAll();
  } catch(e) { setSync('error','Could not load'); }
}

async function saveToServer() {
  setSync('syncing','Saving…');
  try {
    const res = await fetch('/api/data',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(state)});
    if (!res.ok) throw new Error();
    setSync('saved','Saved');
  } catch(e) { setSync('error','Save failed'); }
}

function scheduleSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ saveTimer=null; saveToServer(); },600);
}

function setSync(cls,text) {
  const el=document.getElementById('syncStatus');
  el.className='sync-indicator '+cls; el.textContent=text;
}

function updateProfileTabLabel() {
  const tab = document.getElementById('tab-profile');
  const isOwn = viewingProfile === currentUser.userId;
  // Replace just the text node, keep the SVG intact
  const textNode = Array.from(tab.childNodes).find(n => n.nodeType === 3 && n.textContent.trim());
  if (textNode) textNode.textContent = isOwn ? '\n      Profile\n    ' : '\n      Permissions\n    ';
}

// ── Navigation ─────────────────────────────────────────────────
function switchProfile(profileId) {
  viewingProfile = profileId;
  applyTheme(profileId);
  renderProfileSwitcher();
  updateProfileTabLabel();
  renderAll();
  if (currentScreen==='shop') renderShop();
  if (currentScreen==='profile') {
    if (isOwnProfile()) renderProfile();
    else renderPartnerProfileView();
  }
}

function switchScreen(s) {
  currentScreen = s;
  ['tracker','shop','profile'].forEach(x=>{
    document.getElementById('screen-'+x).className='screen'+(x===s?' visible':'');
    document.getElementById('tab-'+x).className='screen-tab'+(x===s?' active':'');
  });
  updateProfileTabLabel();
  if (s==='shop') renderShop();
  if (s==='profile') {
    if (isOwnProfile()) renderProfile();
    else renderPartnerProfileView();
  }
}

function shiftDay(delta) {
  const d=dateFromKey(selectedDate); d.setDate(d.getDate()+delta);
  selectedDate=keyFromDate(d); renderTracker();
}
function goToday() { selectedDate=getTodayKey(); renderTracker(); }
function setType(t) {
  addType=t;
  ['daily','repeat','monthly','assigned'].forEach(x=>{
    document.getElementById('btn-'+x).className='type-btn'+(x===t?' active-'+x:'');
  });
  document.getElementById('assignedFields').className='assigned-fields'+(t==='assigned'?' visible':'');
}

// ── Profile switcher render ────────────────────────────────────
function renderProfileSwitcher() {
  const sw = document.getElementById('profileSwitcher');
  sw.innerHTML = '';
  const profiles = [
    { id: currentUser.userId, nickname: currentUser.nickname, role: currentUser.role, icon: ps(currentUser.userId).icon || 'heart', isYou: true },
  ];
  if (currentUser.partnerId) {
    profiles.push({ id: currentUser.partnerId, nickname: currentUser.partnerNickname, role: currentUser.partnerRole, icon: ps(currentUser.partnerId).icon || 'star', isYou: false });
  }
  profiles.forEach(p => {
    const isActive = viewingProfile === p.id;
    const themeClass = p.id === 'gg' ? 'active-gg' : 'active-dad';
    const btn = document.createElement('button');
    btn.className = 'profile-btn' + (isActive ? ' '+themeClass : '');
    btn.innerHTML = `
      <div class="p-icon">${iconSVG(p.icon, 18)}</div>
      <div class="p-name-row">

// ── SVG helpers ────────────────────────────────────────────────
function checkSVG() { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>`; }
function trashSVG() { return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`; }
function heartPath() { return `<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>`; }
function starPath()  { return `<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>`; }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function makeTaskRow(opts) {
  const row = document.createElement('div');
  row.className = 'task-row'+(opts.done?' done':'')+(opts.extraClass?' '+opts.extraClass:'');
  const checkDisabled = opts.checkDisabled ? ' disabled' : '';
  row.innerHTML = `
    <div class="task-check${checkDisabled}">${checkSVG()}</div>
    <div class="task-body">
      <div class="task-name">${esc(opts.name)}</div>
      ${opts.desc?`<div class="task-desc">${esc(opts.desc)}</div>`:''}
    </div>
    <div class="task-right">
      <span class="pts-badge">${opts.pts} pts</span>
      ${opts.extraButtons||''}
      ${opts.showDelete!==false?`<button class="task-delete">${trashSVG()}</button>`:''}
    </div>`;
  if (!opts.checkDisabled) row.querySelector('.task-check').onclick = opts.onCheck;
  if (opts.showDelete!==false) row.querySelector('.task-delete').onclick = opts.onDelete;
  return row;
}

// ── Tracker render ─────────────────────────────────────────────
function renderTracker() {
  renderWeek();
  renderAssigned();
  renderMonthly();
  renderDaily();
  renderTotals();
  const isOwn = isOwnProfile();
  const canAddTasks = isOwn || viewedProfileGrantsTaskPerms();
  // Show/hide task type buttons based on permissions
  document.getElementById('addTaskSection').style.display = 'block';
  document.getElementById('btn-daily').style.display   = canAddTasks ? '' : 'none';
  document.getElementById('btn-repeat').style.display  = canAddTasks ? '' : 'none';
  document.getElementById('btn-monthly').style.display = canAddTasks ? '' : 'none';
  if (!canAddTasks && addType !== 'assigned') setType('assigned');
  // Readonly notice — only show for non-assigned section
  const existing = document.getElementById('readonlyNotice');
  if (existing) existing.remove();
  if (!isOwn) {
    const notice = document.createElement('div');
    notice.id = 'readonlyNotice';
    notice.className = 'readonly-notice';
    const partnerName = currentUser.partnerNickname || 'Partner';
    notice.textContent = canAddTasks
      ? `Viewing ${partnerName}'s tasks — you can add tasks`
      : `Viewing ${partnerName}'s tasks — you can assign tasks below`;
    document.getElementById('screen-tracker').insertBefore(notice, document.getElementById('assignedList').previousElementSibling.previousElementSibling);
  }
}

function renderAssigned() {
  const list = document.getElementById('assignedList');
  list.innerHTML = '';
  const today = getTodayKey();
  const p = ps();
  const visible = (p.assigned||[]).filter(t=>{
    if (t.completedOn) return t.completedOn===selectedDate;
    return t.expiresOn>=selectedDate;
  });
  const expiredUncompleted = (p.assigned||[]).filter(t=>{
    if (t.completedOn) return false;
    return t.expiresOn<selectedDate && t.assignedOn<=selectedDate;
  });
  const all = [...visible,...expiredUncompleted];
  if (!all.length) {
    list.innerHTML=`<div class="empty-state"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>No assigned tasks</div>`;
    return;
  }
  all.forEach(t=>{
    const isExpired=!t.completedOn&&t.expiresOn<today;
    const isDone=!!t.completedOn;
    let expiryLabel='',expiryCls='ok';
    if (!isDone) {
      const exp=dateFromKey(t.expiresOn),now=dateFromKey(today);
      const diffDays=Math.round((exp-now)/86400000);
      if (isExpired){expiryLabel='Expired';expiryCls='expired';}
      else if (diffDays===0){expiryLabel='Expires today';expiryCls='soon';}
      else if (diffDays===1){expiryLabel='Expires tomorrow';expiryCls='soon';}
      else if (diffDays<=3){expiryLabel=`${diffDays}d left`;expiryCls='soon';}
      else{expiryLabel=`Due ${new Date(exp.getTime()).toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;expiryCls='ok';}
    }
    const expiryTag=!isDone?`<span class="expiry-tag ${expiryCls}">${expiryLabel}</span>`:'';
    const rowExtra='assigned-row'+(expiryCls==='soon'?' expiring-soon':'');
    // Own profile = can check off. Partner's assigned tasks viewed by partner = can check. Viewing partner's profile = read only
    const canCheck = isOwnProfile() && !isExpired;
    const row=makeTaskRow({
      done:isDone,name:t.name,desc:t.desc,pts:t.pts,extraClass:rowExtra,
      extraButtons:expiryTag,checkDisabled:!canCheck,showDelete:isOwnProfile(),
      onCheck:()=>{
        if (isDone){const idx=p.assigned.findIndex(x=>x.id===t.id);if(idx>=0)p.assigned[idx].completedOn=null;}
        else{const idx=p.assigned.findIndex(x=>x.id===t.id);if(idx>=0)p.assigned[idx].completedOn=selectedDate;}
        scheduleSave();renderTracker();
      },
      onDelete:()=>{const idx=p.assigned.findIndex(x=>x.id===t.id);if(idx>=0)p.assigned.splice(idx,1);scheduleSave();renderTracker();}
    });
    list.appendChild(row);
  });
}

function renderMonthly() {
  const list=document.getElementById('monthlyList');
  list.innerHTML='';
  const tasks=getMonthlyTasks(selectedDate),mk=monthKey(selectedDate);
  const done=ps().monthlyDone[mk]||{};
  if(!tasks.length){list.innerHTML=`<div class="empty-state"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>No monthly tasks</div>`;return;}
  tasks.forEach(t=>{
    const isDone=!!done[t.id];
    const canCheck=isOwnProfile();
    const row=makeTaskRow({done:isDone,name:t.name,desc:t.desc,pts:t.pts,extraClass:'monthly-row',checkDisabled:!canCheck,showDelete:isOwnProfile(),
      onCheck:()=>{if(!ps().monthlyDone[mk])ps().monthlyDone[mk]={};ps().monthlyDone[mk][t.id]=isDone?null:selectedDate;scheduleSave();renderTracker();},
      onDelete:()=>{ps().monthly[mk]=ps().monthly[mk].filter(x=>x.id!==t.id);scheduleSave();renderTracker();}
    });
    list.appendChild(row);
  });
}

function renderDaily() {
  const list=document.getElementById('dailyList');
  list.innerHTML='';
  const repeating=getRepeatingForDay(selectedDate),rdone=ps().repeatingDone[selectedDate]||{};
  repeating.forEach(t=>{
    const isDone=!!rdone[t.id];
    const canCheck=isOwnProfile();
    const row=makeTaskRow({done:isDone,name:t.name,desc:t.desc,pts:t.pts,extraClass:'repeat-row',
      checkDisabled:!canCheck,showDelete:isOwnProfile(),
      extraButtons:isOwnProfile()?`<button class="task-delete-future">Del future</button>`:'',
      onCheck:()=>{if(!ps().repeatingDone[selectedDate])ps().repeatingDone[selectedDate]={};ps().repeatingDone[selectedDate][t.id]=!isDone;scheduleSave();renderTracker();},
      onDelete:()=>{ps().repeatingDeleted[t.id]=selectedDate;scheduleSave();renderTracker();}
    });
    if (isOwnProfile()) {
      row.querySelector('.task-delete-future').onclick=()=>{const d=dateFromKey(selectedDate);d.setDate(d.getDate()+1);ps().repeatingDeleted[t.id]=keyFromDate(d);scheduleSave();renderTracker();};
    }
    list.appendChild(row);
  });
  const tasks=getDayTasks(selectedDate);
  if(!tasks.length&&!repeating.length){list.innerHTML=`<div class="empty-state"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="4" rx="1"/><path d="M5 4h-1a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2h-1"/></svg>No tasks for this day${isOwnProfile()?' — add one below':''}</div>`;return;}
  tasks.forEach((t,i)=>{
    const canCheck=isOwnProfile();
    const row=makeTaskRow({done:t.done,name:t.name,desc:t.desc,pts:t.pts,checkDisabled:!canCheck,showDelete:isOwnProfile(),
      onCheck:()=>{getDayTasks(selectedDate)[i].done^=true;scheduleSave();renderTracker();},
      onDelete:()=>{ps().days[selectedDate].tasks.splice(i,1);scheduleSave();renderTracker();}
    });
    list.appendChild(row);
  });
}

function renderWeek() {
  const strip=document.getElementById('weekStrip');
  strip.innerHTML='';
  const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],mn=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const sel=dateFromKey(selectedDate),dow=sel.getDay();
  for(let i=0;i<7;i++){
    const d=new Date(sel);d.setDate(sel.getDate()-dow+i);
    const key=keyFromDate(d),pts=getDayPoints(key);
    const pill=document.createElement('div');
    pill.className='day-pill'+(key===selectedDate?' active':'');
    pill.innerHTML=`<span class="day-label">${dn[d.getDay()]}</span><span class="day-num">${d.getDate()}</span><span class="day-pts">${pts>0?pts:''}</span>`;
    pill.onclick=()=>{selectedDate=key;renderTracker();};
    strip.appendChild(pill);
  }
  const ws=new Date(sel);ws.setDate(sel.getDate()-dow);
  const we=new Date(sel);we.setDate(sel.getDate()-dow+6);
  document.getElementById('weekLabel').textContent=ws.getMonth()===we.getMonth()
    ?`${mn[ws.getMonth()]} ${ws.getDate()}–${we.getDate()}, ${ws.getFullYear()}`
    :`${mn[ws.getMonth()]} ${ws.getDate()} – ${mn[we.getMonth()]} ${we.getDate()}, ${we.getFullYear()}`;
}

function renderTotals() {
  const earned=getTotalEarned(),spent=getTotalSpent(),balance=earned-spent;
  document.getElementById('totalPts').textContent=getDayPoints(selectedDate);
  document.getElementById('alltimePts').textContent=balance;
  const earnedEl=document.getElementById('alltimeEarned');
  earnedEl.textContent=spent>0?`${earned} earned · ${spent} spent`:(`${earned} pts earned total`);
  document.getElementById('totalLabel').textContent=selectedDate===getTodayKey()?'Points earned today':'Points earned';
  const viewingName = isOwnProfile() ? 'Your' : (currentUser.partnerNickname||'Partner')+"'s";
  document.getElementById('alltimeLabel').textContent=`${viewingName} points available`;
}

}

function redeemReward(item) {
  const myBalance = getBalance(currentUser.userId);
  if (myBalance < item.cost) return;
  // Add to MY inventory, tag with fromUserId = partner
  ps(currentUser.userId).inventory.push({
    id: uid(), rewardId: item.id, name: item.name, desc: item.desc,
    cost: item.cost, fromUserId: currentUser.partnerId,
    redeemedAt: Date.now(), fulfilled: false
  });
  scheduleSave(); renderShop(); renderTotals();
}

// ── Permissions helpers ────────────────────────────────────────
function getMyPermissionsFor(partnerId) {
  const p = ps(currentUser.userId);
  if (!p.permissions) p.permissions = {};
  if (!p.permissions[partnerId]) p.permissions[partnerId] = { tasks: false, shop: false };
  return p.permissions[partnerId];
}

function viewedProfileGrantsTaskPerms() {
  if (isOwnProfile()) return true;
  const viewedProfile = ps(viewingProfile);
  if (!viewedProfile.permissions) return false;
  const perms = viewedProfile.permissions[currentUser.userId];
  return !!(perms && perms.tasks);
}

function viewedProfileGrantsShopPerms() {
  if (isOwnProfile()) return true;
  const viewedProfile = ps(viewingProfile);
  if (!viewedProfile.permissions) return false;
  const perms = viewedProfile.permissions[currentUser.userId];
  return !!(perms && perms.shop);
}

function savePermission(partnerId, key, value) {
  const p = ps(currentUser.userId);
  if (!p.permissions) p.permissions = {};
  if (!p.permissions[partnerId]) p.permissions[partnerId] = { tasks: false, shop: false };
  p.permissions[partnerId][key] = value;
  scheduleSave();
}

// ── Profile screens ────────────────────────────────────────────
function renderProfile() {
  const p = ps(currentUser.userId);
  const name = [p.firstName, p.lastName].filter(Boolean).join(' ') || p.nickname || 'You';
  const earned = getTotalEarned(currentUser.userId);
  const balance = getBalance(currentUser.userId);
  const icon = p.icon || 'heart';
  document.getElementById('profileInfoCard').innerHTML = `
    <div class="profile-avatar">
      ${iconSVG(icon, 30)}
    </div>
    <div>
      <div class="profile-display-name">${esc(name)}</div>
      ${p.nickname?`<div class="profile-display-role">"${esc(p.nickname)}" · ${esc(p.role||'')}</div>`:''}
      <div class="profile-display-email">${esc(p.notificationEmail||'No email set')}</div>
      <div class="profile-display-pts">${balance} pts available · ${earned} earned</div>
    </div>`;
  document.getElementById('profileFirstName').value = p.firstName||'';
  document.getElementById('profileLastName').value  = p.lastName||'';
  document.getElementById('profileNickname').value  = p.nickname||'';
  document.getElementById('profileEmail').value     = p.notificationEmail||'';
  const roleSelect = document.getElementById('profileRole');
  if (p.role) {
    const opt = Array.from(roleSelect.options).find(o=>o.value===p.role);
    if (opt) roleSelect.value = p.role;
  }
  // Show edit form
  document.querySelector('#screen-profile .divider').style.display='';
  document.querySelectorAll('#screen-profile .section-head').forEach(el=>el.style.display='');
  document.querySelector('#screen-profile .add-form').style.display='';
  renderIconPicker(icon);
}

function renderPartnerProfileView() {
  if (!currentUser.partnerId) return;
  const p = ps(viewingProfile);
  const name = [p.firstName,p.lastName].filter(Boolean).join(' ') || p.nickname || 'Partner';
  const earned = getTotalEarned(viewingProfile);
  const balance = getBalance(viewingProfile);
  const icon = p.icon || 'star';
  const perms = getMyPermissionsFor(viewingProfile);
  const partnerName = p.nickname || 'Partner';
  document.getElementById('profileInfoCard').innerHTML = `
    <div class="profile-avatar">${iconSVG(icon, 30)}</div>
    <div>
      <div class="profile-display-name">${esc(name)}</div>
      ${p.nickname?`<div class="profile-display-role">"${esc(p.nickname)}" · ${esc(p.role||'')}</div>`:''}
      <div class="profile-display-email">${esc(p.notificationEmail||'')}</div>
      <div class="profile-display-pts">${balance} pts available · ${earned} earned</div>
    </div>`;
  document.querySelector('#screen-profile .divider').style.display='none';
  document.querySelectorAll('#screen-profile .section-head').forEach(el=>el.style.display='none');
  document.querySelector('#screen-profile .add-form').style.display='none';
  // Remove existing permissions section
  const existing = document.getElementById('permissionsSection');
  if (existing) existing.remove();
  // Add permissions section
  const section = document.createElement('div');
  section.id = 'permissionsSection';
  section.className = 'permissions-section';
  section.innerHTML = `
    <div class="permissions-title">Permissions for ${esc(partnerName)}</div>
    <div class="perm-row">
      <div>
        <div class="perm-label">Allow ${esc(partnerName)} to add tasks</div>
        <div class="perm-desc">Daily, repeating, monthly and assigned tasks on your profile</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="permTasks" ${perms.tasks?'checked':''} onchange="savePermission('${viewingProfile}','tasks',this.checked);renderTracker()"/>
        <span class="toggle-slider"></span>
      </label>
    </div>
    <div class="perm-row">
      <div>
        <div class="perm-label">Allow ${esc(partnerName)} to add shop rewards</div>
        <div class="perm-desc">Add rewards to your points shop</div>
      </div>
      <label class="toggle">
        <input type="checkbox" id="permShop" ${perms.shop?'checked':''} onchange="savePermission('${viewingProfile}','shop',this.checked);renderShop()"/>
        <span class="toggle-slider"></span>
      </label>
    </div>`;
  document.getElementById('screen-profile').appendChild(section);
}

async function saveProfile() {
  const firstName = document.getElementById('profileFirstName').value.trim();
  const lastName  = document.getElementById('profileLastName').value.trim();
  const nickname  = document.getElementById('profileNickname').value.trim();
  const role      = document.getElementById('profileRole').value;
  const email     = document.getElementById('profileEmail').value.trim();
  const icon      = selectedIcon;
  try {
    await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({firstName,lastName,nickname,role,email,icon})});
    ps(currentUser.userId).firstName = firstName;
    ps(currentUser.userId).lastName  = lastName;
    ps(currentUser.userId).nickname  = nickname;
    ps(currentUser.userId).role      = role;
    ps(currentUser.userId).notificationEmail = email;
    ps(currentUser.userId).icon      = icon;
    currentUser.nickname = nickname;
    currentUser.role     = role;
    currentUser.icon     = icon;
    scheduleSave();
    renderProfile();
    renderProfileSwitcher();
    const msg=document.getElementById('profileSavedMsg');
    msg.textContent='✓ Profile saved';
    setTimeout(()=>{msg.textContent='';},3000);
  } catch(e) { console.error(e); }
}

// ── Add task ───────────────────────────────────────────────────
function addTask() {
  const name=document.getElementById('taskName').value.trim();
  const desc=document.getElementById('taskDesc').value.trim();
  const pts=parseInt(document.getElementById('taskPts').value);
  if(!name){document.getElementById('taskName').focus();return;}
  if(!pts||pts<1){document.getElementById('taskPts').focus();return;}
  if(addType==='monthly'){const mk=monthKey(selectedDate);if(!ps().monthly[mk])ps().monthly[mk]=[];ps().monthly[mk].push({id:uid(),name,desc,pts});}
  else if(addType==='repeat'){ps().repeating.push({id:uid(),name,desc,pts,startDate:selectedDate});}
  else if(addType==='assigned'){
    const expiry=document.getElementById('taskExpiry').value;
    if(!expiry){document.getElementById('taskExpiry').focus();return;}
    const task={id:uid(),name,desc,pts,assignedOn:selectedDate,expiresOn:expiry,completedOn:null};
    ps(viewingProfile).assigned.push(task);
    document.getElementById('taskExpiry').value='';
    notifyAssigned(task,expiry);
  } else {
    getDayTasks(selectedDate).push({id:uid(),name,desc,pts,done:false});
  }
  document.getElementById('taskName').value='';
  document.getElementById('taskDesc').value='';
  document.getElementById('taskPts').value='';
  scheduleSave();renderTracker();
  document.getElementById('taskName').focus();
}

function addReward() {
  const name=document.getElementById('rewardName').value.trim();
  const desc=document.getElementById('rewardDesc').value.trim();
  const cost=parseInt(document.getElementById('rewardCost').value);
  if(!name){document.getElementById('rewardName').focus();return;}
  if(!cost||cost<1){document.getElementById('rewardCost').focus();return;}
  // Add to whichever profile's shop we're viewing
  const targetId = isOwnProfile() ? currentUser.userId : viewingProfile;
  ps(targetId).shop.push({id:uid(),name,desc,cost});
  document.getElementById('rewardName').value='';
  document.getElementById('rewardDesc').value='';
  document.getElementById('rewardCost').value='';
  scheduleSave();renderShop();
}

async function notifyAssigned(task,expiresOn) {
  // If assigning to self, notify partner; if partner is viewing, notify them
  const targetId = viewingProfile; // we assign tasks on the profile we're viewing
  const targetProfile = ps(targetId);
  const to = targetProfile.notificationEmail;
  if (!to) return;
  const firstName = targetProfile.firstName || targetProfile.nickname || 'there';
  try {
    await fetch('/api/notify/assigned',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({to,taskName:task.name,taskDesc:task.desc,pts:task.pts,expiresOn,profileName:firstName})});
  } catch(e){console.log('Notification failed:',e);}
}

document.getElementById('loginPassword').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});

const ICON_LABELS = {
  heart:'Heart', star:'Star', crown:'Crown', moon:'Moon', sun:'Sun',
  lock:'Lock', key:'Key', diamond:'Diamond', flame:'Flame', butterfly:'Butterfly',
  rose:'Shield', paw:'Paw', sparkle:'Sparkle', shield:'Rose', feather:'Feather', infinity:'Infinity'
};

let selectedIcon = 'heart';

function iconSVG(iconId, size=20) {
  const path = ICONS[iconId] || ICONS.heart;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
}

function renderIconPicker(currentIconId) {
  selectedIcon = currentIconId || 'heart';
  const picker = document.getElementById('iconPicker');
  picker.innerHTML = '';
  Object.keys(ICONS).forEach(id => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-opt' + (id === selectedIcon ? ' selected' : '');
    btn.title = ICON_LABELS[id] || id;
    btn.innerHTML = iconSVG(id, 20);
    btn.onclick = () => {
      selectedIcon = id;
      document.querySelectorAll('.icon-opt').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    picker.appendChild(btn);
  });
}
